<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FlowBoard Video Calls — Room Entry (key screen)</title>
<style>
/*
  Governed by: EXPERIENCE.md → Information Architecture (Room Entry row),
  Component Patterns → "Room Entry form" row, State Patterns → "Room Entry, idle".
  Tokens from: DESIGN.md frontmatter (colors, typography, rounded, spacing).
*/
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: #1A1A1A;
  color: #F2F2F2;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.browser-frame {
  width: 1100px;
  height: 680px;
  background: #1A1A1A;
  border: 1px solid #3A3A3A;
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.browser-chrome {
  height: 36px;
  background: #242424;
  border-bottom: 1px solid #3A3A3A;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 6px;
  flex-shrink: 0;
}
.dot { width: 10px; height: 10px; border-radius: 9999px; background: #3A3A3A; }
.browser-url {
  margin-left: 16px;
  font-size: 12px;
  color: #A3A3A3;
  font-family: 'Cascadia Code', 'SF Mono', Consolas, monospace;
}
.stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  width: 400px;
  background: #242424;
  border: 1px solid #3A3A3A;
  border-radius: 14px;
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.brand {
  font-size: 28px;
  font-weight: 600;
  line-height: 1.25;
  text-align: center;
}
.brand-mark { color: #2DD4BF; }
.field-group { display: flex; flex-direction: column; gap: 8px; }
label {
  font-size: 13px;
  font-weight: 500;
  color: #A3A3A3;
}
input {
  background: #1A1A1A;
  border: 1px solid #3A3A3A;
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 15px;
  color: #F2F2F2;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
input.mono {
  font-family: 'Cascadia Code', 'SF Mono', Consolas, monospace;
  font-size: 15px;
  letter-spacing: 0.02em;
}
input::placeholder { color: #6B6B6B; }
.room-row { display: flex; gap: 8px; }
.room-row input { flex: 1; }
.btn {
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 15px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
}
.btn-secondary {
  background: #2E2E2E;
  color: #F2F2F2;
  border: 1px solid #3A3A3A;
}
.btn-primary {
  background: #2DD4BF;
  color: #0A2320;
  width: 100%;
  padding: 14px 16px;
  font-weight: 600;
}
.hint { font-size: 12px; color: #6B6B6B; text-align: center; }
</style>
</head>
<body>
<div class="browser-frame">
  <div class="browser-chrome">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <span class="browser-url">flowboard.local/</span>
  </div>
  <div class="stage">
    <div class="card">
      <div class="brand">Flow<span class="brand-mark">Board</span></div>
      <div class="field-group">
        <label for="name">Display Name</label>
        <input id="name" type="text" placeholder="e.g. Maria">
      </div>
      <div class="field-group">
        <label for="room">Room ID</label>
        <div class="room-row">
          <input id="room" class="mono" type="text" placeholder="type or generate">
          <button class="btn btn-secondary">Generate</button>
        </div>
      </div>
      <button class="btn btn-primary">Create / Join</button>
      <div class="hint">No account needed — just a name and a room ID.</div>
    </div>
  </div>
</div>
</body>
</html>
